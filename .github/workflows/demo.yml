name: Demo

# Pubblica la demo (apps/demo) su GitHub Pages (ADR 0009): solo file statici, i dati restano nel browser di
# chi la prova. Parte a ogni push su main e a mano dalla scheda Actions. Finché il repository è privato il
# lavoro viene saltato; quando sarà pubblico basta attivare Pages (Settings → Pages → Source: GitHub Actions).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una pubblicazione alla volta; quella in corso non si interrompe a metà.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm demo:build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/demo/dist
      - id: deployment
        uses: actions/deploy-pages@v5
