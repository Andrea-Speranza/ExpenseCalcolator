name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Usa la versione di pnpm indicata in "packageManager" nel package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # Test E2E nel Chromium di Playwright, con le librerie di sistema che gli servono.
      - run: pnpm --filter @expense/web exec playwright install --with-deps chromium
      - run: pnpm e2e
      # Se falliscono, il rapporto con le tracce si scarica dalla pagina dell'esecuzione.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
