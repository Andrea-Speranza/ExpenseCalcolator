# Le cartelle senza package.json (es. adapter e app non ancora iniziati) vengono ignorate.
packages:
  - packages/*
  - packages/adapters/*
  - packages/channels/*
  - apps/*

# Pacchetti autorizzati a eseguire script durante l'installazione (pnpm li blocca per sicurezza).
onlyBuiltDependencies:
  - esbuild
